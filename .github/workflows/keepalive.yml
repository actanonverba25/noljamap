name: Supabase keep-alive

# 무료 플랜 자동 일시정지(7일 무활동) 방지 — 하루 1번 Supabase REST에 가벼운 SELECT.
on:
  schedule:
    - cron: "0 3 * * *"      # 매일 03:00 UTC (12:00 KST)
  workflow_dispatch:          # 수동 실행도 가능

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST (keep project active)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: sb_publishable_ztkKhhHjrANrspaKy2UK8A_SYVhJURB" \
            "https://lxgcocblgulxjqfjvwfg.supabase.co/rest/v1/posts?select=id&limit=1")
          echo "Supabase responded: $code"
          test "$code" = "200"
